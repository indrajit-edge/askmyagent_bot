# ==============================================================================
# Koyeb Production App & Service Configuration Blueprint
# ==============================================================================
name: askmyagent
services:
  - name: askmyagent-backend
    type: web
    git:
      branch: main
      workdir: /
    build:
      command: npm install && npm run build --workspace=backend
    run:
      command: npm run start --workspace=backend
    env:
      NODE_ENV: production
      PORT: "8000"
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    health_checks:
      - path: /api/health
        port: 8000
        interval: 30
        timeout: 5
        healthy_threshold: 2
        unhealthy_threshold: 3
    regions:
      - fra
    instance_types:
      type: nano
    scalings:
      min: 1
      max: 2
